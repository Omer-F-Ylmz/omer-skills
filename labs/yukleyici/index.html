<!doctype html>
<meta charset="utf-8"><title>lab · yükleyici + giriş koreografisi</title>
<link rel="stylesheet" href="/labs/ortak.css">
<style>
  #perde { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; fill: #e8d9c2; }
  #yuk { position: fixed; inset: 0; z-index: 4; color: #1a120c; display: flex; align-items: flex-end; justify-content: space-between; padding: 4vw; box-sizing: border-box; }
  #yuk b { font: 900 18vw/0.8 system-ui; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
  #yuk > span { font: 600 1rem system-ui; letter-spacing: 0.2em; }
  #yuk i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: #1a120c; transform-origin: left; transform: scaleX(0); }
  h1 { position: fixed; left: 6vw; top: 14vh; z-index: 2; margin: 0; font: 900 12vw/0.85 system-ui; letter-spacing: -0.04em; }
  p.alt { position: fixed; left: 6.4vw; top: calc(14vh + 21vw); z-index: 2; margin: 0; font: 500 1.1rem system-ui; letter-spacing: 0.18em; color: #f2ebe1; }
</style>
<script type="importmap">{"imports":{"three":"/labs/node_modules/three/build/three.module.js","three/addons/":"/labs/node_modules/three/examples/jsm/","gsap":"/labs/node_modules/gsap/index.js","gsap/ScrollTrigger":"/labs/node_modules/gsap/ScrollTrigger.js","gsap/SplitText":"/labs/node_modules/gsap/SplitText.js","lenis":"/labs/node_modules/lenis/dist/lenis.mjs","postprocessing":"/labs/node_modules/postprocessing/build/index.js"}}</script>
<svg id="perde" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0H100V100H0Z"/></svg>
<div id="yuk"><span>YÜKLENİYOR</span><b>000</b><i></i></div>
<canvas class="sahne"></canvas>
<h1>Telve<br>Evi</h1>
<p class="alt">KÖZDE PİŞEN KAHVE</p>
<script type="module">
  import * as THREE from 'three';
  import gsap from 'gsap';
  import { SplitText } from 'gsap/SplitText';
  import { kur, dunya, lab } from '/labs/ortak.js';
  import { yukleyici } from '/tools/site-kit/sablon/src/sahne/yukleyici.js';

  gsap.registerPlugin(SplitText);
  const t0 = performance.now();
  const { r, kam } = kur(document.querySelector('canvas'));
  const { s } = dunya(r);
  const bak = () => kam.lookAt(-1.6, 0.6, 0); // hedef sola → cezve sağ yarıda, başlıkla çakışmaz
  kam.position.set(0, 6, 16); bak();
  const baslik = SplitText.create('h1', { type: 'chars', mask: 'lines' });
  gsap.set(baslik.chars, { yPercent: 110 });
  gsap.set('p.alt', { autoAlpha: 0, y: 20 });
  // perde: alt kenarı sıvı gibi dalgalanan SVG yolu; ortası geride kalır (dil), dalga genliği geçişin ortasında tepe yapar
  const yol = document.querySelector('#perde path'), pd = { k: 0 };
  const perdeCiz = () => {
    const t = performance.now() / 1000, g = Math.sin(pd.k * Math.PI);
    let d = 'M0,0H100';
    for (let x = 100; x >= 0; x -= 2) {
      const y = 100 * (1 - pd.k) + g * (22 * Math.sin((x / 100) * Math.PI) + 5 * Math.sin(x * 0.11 + t * 4) + 3 * Math.sin(x * 0.27 - t * 6));
      d += `L${x},${Math.max(0, y).toFixed(2)}`;
    }
    yol.setAttribute('d', d + 'Z');
  };
  const giris = () => gsap.timeline()
    .to('#yuk b, #yuk > span', { yPercent: -40, autoAlpha: 0, duration: 0.5, ease: 'power2.in' })
    .to('#yuk i', { scaleX: 0, transformOrigin: 'right', duration: 0.4, ease: 'power2.in' }, '<')
    .to(pd, { k: 1, duration: 1.5, ease: 'expo.inOut', onUpdate: perdeCiz }, '<0.2')
    .to(kam.position, { x: 1.2, y: 1.6, z: 5.2, duration: 2.6, ease: 'power3.out', onUpdate: bak }, '<0.25')
    .to(baslik.chars, { yPercent: 0, duration: 1.2, ease: 'expo.out', stagger: 0.05 }, '<0.7')
    .to('p.alt', { autoAlpha: 1, y: 0, duration: 0.9, ease: 'power3.out' }, '<0.5');
  const m = yukleyici(document.querySelector('#yuk b'), giris);
  m.onProgress = ((op) => (u, n, top) => { op(u, n, top); gsap.to('#yuk i', { scaleX: n / top, duration: 0.8, ease: 'power2.out' }); })(m.onProgress);
  // gerçek baytlar: kendi kitaplık dosyalarımız (varlık yerine); hepsi aynı anda — kademeli başlatma onLoad'u ilk dosyada tetikler
  const fl = new THREE.FileLoader(m);
  ['three/build/three.module.js', 'postprocessing/build/index.js', 'gsap/gsap-core.js', 'gsap/ScrollTrigger.js', 'lenis/dist/lenis.mjs']
    .forEach((f) => fl.load('/labs/node_modules/' + f));
  r.setAnimationLoop(() => { r.render(s, kam); lab.kare++; });
  // p ölçeği: 0..1 → açılıştan sonra 0..5 sn
  lab.git = (p) => new Promise((ok) => setTimeout(ok, Math.max(0, t0 + p * 5000 - performance.now())));
  lab.hazir = true;
</script>

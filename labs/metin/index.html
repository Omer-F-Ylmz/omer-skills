<script type="module">
  import gsap from 'gsap';
  import { kur, dunya, kaydir, kosu, lab } from '/labs/ortak.js';
  import { metinGir } from '/tools/site-kit/sablon/src/sahne/metin.js';
  import { dongu } from '/tools/site-kit/sablon/src/sahne/dongu.js';

  const cv = document.querySelector('canvas');
  const { r, kam } = kur(cv);
  const { s, cezve } = dunya(r, { arka: null });
  kam.position.set(0, 0.9, 4.2); kam.lookAt(0, 0.55, 0);
  const o = { a: 0 };
  const iste = dongu(r, cv, () => { cezve.rotation.y = o.a; cezve.position.y = -o.a * 0.15; r.render(s, kam); lab.kare++; return false; });
  kaydir();
  gsap.to(o, { a: Math.PI * 1.5, ease: 'none', onUpdate: iste, scrollTrigger: kosu() });
  // dev tip cezvenin arkasında, kaydırmada ters yönde kayar (paralaks katmanı)
  gsap.to('.dev', { yPercent: -35, ease: 'none', scrollTrigger: kosu() });
  metinGir(document.querySelector('.dev'));
  document.querySelectorAll('section p').forEach((p) => metinGir(p));
  r.render(s, kam);
  lab.hazir = true;
</script>

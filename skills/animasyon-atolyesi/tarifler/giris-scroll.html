<!doctype html>
<!--
  Tarif: hero kademeli giriş + scroll'a bağlı bölüm görünme + scroll ilerleme çubuğu. Sıfır bağımlılık.
  Nasıl uyarlanır:
  1. Yalnız aşağıdaki AYAR bloğunu değiştir (renk, süre, gecikme, eğri, metinler); CSS/JS gövdesine dokunma.
  2. Bölüm sayısı AYAR.metin.bolumler dizisinin uzunluğudur; öğe ekle/çıkar, işaretleme kendiliğinden üretilir.
  3. Yeni giriş öğesi gerekiyorsa hero'ya class="kademe" style="--i:N" ile ekle (N = sıra; gecikme = N × AYAR.gecikme).
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş + scroll tarifi</title>
<script>
/* ===== AYAR — uyarlayan ajan yalnız bu bloğu değiştirir ===== */
const AYAR = {
  renk: { zemin: '#f5f1ea', murekkep: '#1c1a17', soluk: '#6b645a', yuzey: '#fffdf9', vurgu: '#c2410c' },
  sure: '900ms',                         // tek öğenin giriş süresi
  gecikme: '120ms',                      // kademe aralığı: animation-delay = --i × gecikme
  egri: 'cubic-bezier(.16, 1, .3, 1)',   // ease-out
  metin: {
    baslik: 'Hareket, anlamı taşısın.',
    alt: 'Kademeli giriş, kaydırmaya bağlı görünme ve ilerleme çubuğu — yalnız CSS, birkaç satır yedek JS.',
    cta: 'Bölümlere in',
    bolumler: [
      { baslik: 'Önce içerik', metin: 'Başlık ilk karede görünür; yalnız yerine oturur. En büyük içerik boyaması gecikmez.' },
      { baslik: 'Yalnız transform ve opacity', metin: 'Düzen hesaplanmaz, boyama tekrarlanmaz; kompozitör tek başına yürütür.' },
      { baslik: 'Kaydırma zaman çizelgesi', metin: 'Bölümler görünüm alanına girdikçe belirir; tarayıcı desteklemiyorsa IntersectionObserver devralır.' },
      { baslik: 'Hareketi azalt', metin: 'İşletim sistemi tercihi açıksa her şey anında, son hâliyle gelir.' }
    ]
  }
};
/* ===== AYAR SONU ===== */
const kok = document.documentElement.style;
for (const [ad, deger] of Object.entries(AYAR.renk)) kok.setProperty('--' + ad, deger);
kok.setProperty('--sure', AYAR.sure); kok.setProperty('--gecikme', AYAR.gecikme); kok.setProperty('--egri', AYAR.egri);
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0; background: var(--zemin); color: var(--murekkep);
    font: 400 1.0625rem/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  h1, h2 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 600; text-wrap: balance; }

  /* Scroll ilerleme çubuğu */
  .ilerleme {
    position: fixed; inset: 0 0 auto; z-index: 10; height: 3px; display: none;
    background: var(--vurgu); transform-origin: 0 50%; transform: scaleX(0);
  }
  @supports (animation-timeline: scroll()) {
    .ilerleme { display: block; animation: ilerle linear both; animation-timeline: scroll(root); }
  }
  @keyframes ilerle { to { transform: scaleX(1); } }

  /* Hero */
  .hero {
    min-height: 100svh; display: grid; align-content: center; gap: 1.5rem;
    padding: 8vh max(6vw, 1.5rem);
    background: radial-gradient(60rem 40rem at 85% 10%, color-mix(in srgb, var(--vurgu) 14%, transparent), transparent 70%);
  }
  .hero h1 { font-size: clamp(2.75rem, 7.5vw, 6.25rem); line-height: 1.02; letter-spacing: -.03em; max-width: 13ch; margin: 0; }
  .hero p { font-size: clamp(1.1rem, 1.6vw, 1.35rem); color: var(--soluk); max-width: 38ch; margin: 0; }
  .cta {
    justify-self: start; display: inline-flex; gap: .6em; align-items: center;
    padding: .9em 1.5em; border-radius: 999px; background: var(--murekkep); color: var(--zemin);
    font-weight: 600; text-decoration: none;
  }
  .cta:hover span { transform: translateY(2px); }
  .cta span { transition: transform .2s var(--egri); }
  .cta:focus-visible { outline: 3px solid var(--vurgu); outline-offset: 3px; }

  .kademe {
    animation: giris var(--sure) var(--egri) both;
    animation-delay: calc(var(--i, 0) * var(--gecikme));
    will-change: transform, opacity;     /* animationend'de JS kaldırır */
  }
  #baslik { animation-name: giris-baslik; }
  @keyframes giris { from { opacity: 0; transform: translateY(1.25rem); } }
  /* LCP öğesi: opacity'ye dokunulmaz, ilk karede görünür; yalnız yerine oturur */
  @keyframes giris-baslik { from { transform: translateY(.28em) scale(.985); } }

  /* Bölümler */
  .bolumler { max-width: 62rem; margin: 0 auto; padding: 4rem max(6vw, 1.5rem) 30vh; display: grid; gap: 14vh; }
  .bolum {
    display: grid; grid-template-columns: auto 1fr; gap: .25rem 2rem; align-items: baseline;
    padding: clamp(1.75rem, 4vw, 3.25rem); border-radius: 1.5rem; background: var(--yuzey);
    box-shadow: 0 1px 0 rgb(0 0 0 / .04), 0 24px 48px -28px rgb(60 40 20 / .25);
  }
  .bolum .no { grid-row: span 2; font: 600 clamp(2.5rem, 6vw, 4.5rem)/1 "Iowan Old Style", Georgia, serif; color: var(--vurgu); }
  .bolum h2 { font-size: clamp(1.6rem, 3.2vw, 2.4rem); line-height: 1.15; letter-spacing: -.015em; margin: 0; }
  .bolum p { color: var(--soluk); max-width: 46ch; margin: .5rem 0 0; }

  @supports (animation-timeline: view()) {
    .bolum { animation: belir var(--egri) both; animation-timeline: view(); animation-range: entry 5% cover 35%; }
  }
  @keyframes belir { from { opacity: 0; transform: translateY(3rem) scale(.97); } }
  @supports not (animation-timeline: view()) {
    .bolum { opacity: 0; transform: translateY(3rem) scale(.97); transition: opacity var(--sure) var(--egri), transform var(--sure) var(--egri); }
    .bolum.gorundu { opacity: 1; transform: none; }
  }

  footer { text-align: center; color: var(--soluk); font-size: .9rem; padding: 0 0 4rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; will-change: auto !important; }
    .bolum { opacity: 1 !important; transform: none !important; }
    .ilerleme { display: none !important; }
  }
</style>
</head>
<body>
<div class="ilerleme" aria-hidden="true"></div>
<header class="hero">
  <h1 id="baslik" class="kademe" style="--i:0"></h1>
  <p id="alt" class="kademe" style="--i:1"></p>
  <a id="cta" class="cta kademe" style="--i:2" href="#bolumler"><b></b><span aria-hidden="true">↓</span></a>
</header>
<main id="bolumler" class="bolumler"></main>
<footer>Son.</footer>
<script>
const M = AYAR.metin, $ = s => document.querySelector(s);
$('#baslik').textContent = M.baslik; $('#alt').textContent = M.alt; $('#cta b').textContent = M.cta;
$('#bolumler').innerHTML = M.bolumler.map((b, i) =>
  `<section class="bolum"><span class="no">${String(i + 1).padStart(2, '0')}</span><h2>${b.baslik}</h2><p>${b.metin}</p></section>`).join('');
document.addEventListener('animationend', e => e.target.style.willChange = 'auto');

// Yedek: animation-timeline: view() yoksa IntersectionObserver
if (!CSS.supports('animation-timeline: view()')) {
  const io = new IntersectionObserver(girdiler => girdiler.forEach(g => {
    if (!g.isIntersecting) return;
    g.target.classList.add('gorundu');
    io.unobserve(g.target);
  }), { threshold: .2 });
  document.querySelectorAll('.bolum').forEach(b => io.observe(b));
}
</script>
</body>
</html>

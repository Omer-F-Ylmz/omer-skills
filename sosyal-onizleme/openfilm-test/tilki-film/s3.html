<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script type="module">
import { shot, ease } from "./shot.js";
let box, sub;
shot((r) => {
  r.style.cssText = "width:1920px;height:1080px;background:linear-gradient(135deg,#c2410c,#ff8a3d);position:relative";
  box = document.createElement("div");
  box.textContent = "Tilki 🦊";
  box.style.cssText = "position:absolute;left:0;width:1920px;top:380px;text-align:center;font-size:240px;font-weight:800;color:#fff";
  sub = document.createElement("div");
  sub.textContent = "Made with OpenFilm";
  sub.style.cssText = "position:absolute;left:0;width:1920px;top:700px;text-align:center;font-size:70px;color:#fff3e6";
  r.append(box, sub);
}, (t) => {
  box.style.transform = `scale(${0.8 + 0.2 * ease(t / 1.2)})`;
  box.style.opacity = ease(t / 0.8);
  sub.style.opacity = ease((t - 1) / 0.8);
}, 3.5);
</script></body></html>

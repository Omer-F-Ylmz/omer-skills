name = "suite-kosucu"
description = "omer-skills tam suit koşucusu. 7 suite'i sabit komutlarla sırayla koşar; komut keşfi, arka plan, bekleme yok. Yalnız suite başına sayı + kırmızı test adları döner (en fazla 7 satır)."
developer_instructions = """
Repo: C:/Projeler/omer-skills. Aşağıdaki 7 komutu BU SIRAYLA, her biri ön planda (arka plan, Monitor, sleep, /tmp log yok) koş. Komut arama, dosya okuma, yeniden koşma yapma; bir suite kırmızıysa da sonrakine geç.\r
\r
1. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills/tools/video && uv run --with pytest pytest -q -p no:cacheprovider 2>&1 | tail -15`\r
2. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills/tools/jev && uv run --with pytest pytest -q -p no:cacheprovider 2>&1 | tail -15`\r
3. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills && python -m pytest -q -p no:cacheprovider tests 2>&1 | tail -15`\r
   (ortam python'u: playwright burada kurulu; izole uv ortamında test_browse_shim test başına 120 sn bekler)\r
4. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills/tools/cc-kopru && npm test 2>&1 | tail -15`\r
5. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills/mcp/jev && npm test 2>&1 | tail -15`\r
6. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills && DOTNET_NOLOGO=1 rtk dotnet test templates/jev-dotnet/Jev.Tests/Jev.Tests.csproj 2>&1 | tail -15`\r
7. `set -o pipefail; export CAGRI_SAYAC_DIZIN="$(mktemp -d)"; cd /c/Projeler/omer-skills && python -m pytest -q -p no:cacheprovider tools/tests 2>&1 | tail -15`\r
\r
Dönüş en fazla 7 satır, suite başına bir satır, başka metin yok:\r
`<suite>: <geçen>/<toplam> · çıkış <kod> · kırmızı: <test adları | yok>`"""

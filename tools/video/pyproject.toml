[project]
name = "video-cli"
version = "0.1.0"
description = "Video kademeli izleme: özet, Jev süzgeci, soru, kare; ham veri diskte, ajana kompakt çıktı"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "jev-cli",
]

[project.scripts]
video = "video.cli:calistir"

[tool.uv.sources]
jev-cli = { path = "../jev", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video"]

[dependency-groups]
dev = ["pytest"]

<html><body><script type="application/json">{"require":[["PolarisEmbedSimple","init",[],[{"isSidecar":true,"contextJSON":"{\"context\": {\"type\": \"GraphSidecar\", \"shortcode\": \"DeL7DvgFLRM\", \"copyright_blocked\": false}, \"gql_data\": {\"shortcode_media\": {\"__typename\": \"GraphSidecar\", \"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw2-2.fna.fbcdn.net\\/v\\/t51.82787-15\\/838614347_18123794305934840_1333029619895982910_n.jpg?REDACTED\", \"shortcode\": \"DeL7DvgFLRM\", \"owner\": {\"username\": \"onurhuseyinkocak.ai\"}, \"edge_media_to_caption\": {\"edges\": [{\"node\": {\"text\": \"Uygulaman \\u00e7al\\u0131\\u015f\\u0131yor olabilir ama ilk bak\\u0131\\u015fta \\u201cAI yapt\\u0131\\u201d hissi veriyorsa problem kodda de\\u011fil, tasar\\u0131m referans\\u0131nda olabilir.\\n\\n\\u00c7o\\u011fu vibe coder ayn\\u0131 hatay\\u0131 yap\\u0131yor: Claude Code\\u2019a \\u201cmodern, clean, premium UI yap\\u201d diyor. Sonu\\u00e7? Ayn\\u0131 kartlar, ayn\\u0131 gradient\\u2019ler, ayn\\u0131 yuvarlak k\\u00f6\\u015feler, ayn\\u0131 dashboard hissi.\\n\\nBunu k\\u0131rmak i\\u00e7in \\u00f6nce iyi \\u00f6rnekleri g\\u00f6rmen laz\\u0131m.\\n\\nBu g\\u00f6nderide kulland\\u0131\\u011f\\u0131m 4 kaynak:\\n\\ngodly.design\\n\\u0130nternetteki iyi tasarlanm\\u0131\\u015f web sitelerini ke\\u015ffetmek i\\u00e7in. Be\\u011fendi\\u011fin ekran\\u0131 referans al\\u0131p Claude Code\\u2019a benzer g\\u00f6rsel dili kurdurabilirsin.\\n\\ntransitions.dev\\nUI animasyonlar\\u0131 ve mikro etkile\\u015fimler i\\u00e7in. Kart hover\\u2019lar\\u0131, ge\\u00e7i\\u015fler, tab animasyonlar\\u0131, notification efektleri gibi detaylarla uygulaman\\u0131 daha canl\\u0131 hale getiriyor.\\n\\nanimos.app\\nUygulama ekran g\\u00f6r\\u00fcnt\\u00fclerinden h\\u0131zl\\u0131 lansman videolar\\u0131 haz\\u0131rlamak i\\u00e7in. After Effects a\\u00e7madan \\u00fcr\\u00fcn\\u00fcn\\u00fc daha profesyonel g\\u00f6sterebilirsin.\\n\\ndeck.gallery\\nGer\\u00e7ek \\u015firketlerin sunumlar\\u0131n\\u0131 ve pitch deck\\u2019lerini incelemek i\\u00e7in. D\\u00fczen, tipografi, hik\\u00e2ye ak\\u0131\\u015f\\u0131 ve sunum mant\\u0131\\u011f\\u0131 konusunda direkt referans kayna\\u011f\\u0131.\\n\\nBuradaki kritik nokta \\u015fu:\\n\\nClaude Code\\u2019a sadece \\u201cg\\u00fczel tasar\\u0131m yap\\u201d deme.\\n\\nOna iyi referans g\\u00f6ster.\\n\\nNe kadar iyi \\u00f6rnek verirsen \\u00e7\\u0131kan i\\u015f de o kadar az AI slop g\\u00f6r\\u00fcn\\u00fcr.\\n\\nBen bu 4 linki tek yerde toplad\\u0131m.\\n\\nLinkleri istiyorsan yoruma \\u201cLINKS\\u201d yaz. Sana kaynak sayfas\\u0131n\\u0131 g\\u00f6ndereyim.\\n\\n#VibeCoding #ClaudeCode #UIDesign #WebDesign #AITools\"}}]}, \"edge_sidecar_to_children\": {\"edges\": [{\"node\": {\"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw2-2.fna.fbcdn.net\\/v\\/t51.82787-15\\/838614347_18123794305934840_1333029619895982910_n.jpg?REDACTED\"}}, {\"node\": {\"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw6-1.fna.fbcdn.net\\/v\\/t51.82787-15\\/839631723_18123794317934840_6424090935247855390_n.jpg?REDACTED\"}}, {\"node\": {\"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw2-3.fna.fbcdn.net\\/v\\/t51.82787-15\\/836807153_18123794368934840_6033536806702452492_n.jpg?REDACTED\"}}, {\"node\": {\"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw2-1.fna.fbcdn.net\\/v\\/t51.82787-15\\/836111451_18123794344934840_7378745257189485058_n.jpg?REDACTED\"}}, {\"node\": {\"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw6-1.fna.fbcdn.net\\/v\\/t51.82787-15\\/838328432_18123794338934840_8248747770376455934_n.jpg?REDACTED\"}}, {\"node\": {\"is_video\": false, \"display_url\": \"https:\\/\\/instagram.fsaw6-1.fna.fbcdn.net\\/v\\/t51.82787-15\\/836162722_18123794398934840_2964951247733870811_n.jpg?REDACTED\"}}]}}}}"}]]]}</script></body></html>

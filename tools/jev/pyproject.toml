[project]
name = "jev-cli"
version = "0.1.0"
description = "Jev (TypeSafe) context dışı yargıç CLI: yol ver, kompakt tablo al"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jev = "jev.cli:calistir"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev"]
